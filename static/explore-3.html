<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Robotic Vacuum Cleaner - Product Design</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar-container">
            <div class="sidebar">
                <div class="sidebar-item active"><img src="/static/IconResource/explore-icon-active.png" class="sidebar-icon" alt="Explore"></div>
                <div class="sidebar-item">〇</div>
                <div class="sidebar-item"><img src="/static/IconResource/develop-icon.png" class="sidebar-icon" alt="Develop"></div>
                <div class="sidebar-item">〇</div>
                <div class="sidebar-item"><img src="/static/IconResource/compare-icon.png" class="sidebar-icon" alt="Compare"></div>
            </div>
        </div>
        <div class="main-content">
            <div class="product-input-section">
                <label for="product-name" class="evaluation-title-label">Please select/add initial solutions you’d suggest to start with</label>
            </div>

            <div class="content-grid">
                <div class="card">
                    <div class="card-header" data-section="who">
                        <h3>Who</h3>
                    </div>
                    <div class="tag-container" id="who-container">

                    </div>
                </div>

                <div class="card">
                    <div class="card-header" data-section="why">
                        <h3>Why</h3>
                    </div>
                    <div class="tag-container" id="why-container">

                    </div>
                </div>

                <div class="card" id="where-card">
                    <div class="card-header" data-section="where">
                        <h3>Where</h3>
                    </div>
                    <div class="tag-container" id="where-container">

                    </div>
                </div>


                <div class="card" id="when-card">
                    <div class="card-header" data-section="when">
                        <h3>When</h3>
                    </div>
                    <div class="tag-container" id="when-container">

                    </div>
                </div>
            </div>

            <div class="continue-section">
                <button id="continue-btn">Continue →</button>
            </div>
        </div>
    </div>

    <script src="/static/explore-3-script.js"></script>
</body>
</html>
