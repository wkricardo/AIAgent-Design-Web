<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Robotic Vacuum Cleaner - Product Design</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
    <div class="sidebar-item active">Explore</div>
    <div class="sidebar-item">Develop</div>
    <div class="sidebar-item">Compare</div>
</div>
        <div class="main-content">
            <div class="product-input-section">
                <label for="product-name" class="product-label">What :</label>
                <input type="text" id="product-name" value="Smart Robotic Vacuum Cleaner">
            </div>

            <div class="content-grid">
                <div class="card">
                    <div class="card-header">
                        <h3>Who</h3>
                        <button class="add-btn" data-section="who">+</button>
                    </div>
                    <div class="tag-container" id="who-container">
                        <div class="tag">Major metropolitan areas <span class="remove-tag">×</span></div>
                        <div class="tag">Family of three <span class="remove-tag">×</span> with kids <span class="remove-tag">×</span> (4-10 yrs old)</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3>Why</h3>
                        <button class="add-btn" data-section="why">+</button>
                    </div>
                    <div class="tag-container" id="why-container">
                        <div class="tag">Dust remains in corners <span class="remove-tag">×</span></div>
                        <div class="tag">Toys being dragged across the floor <span class="remove-tag">×</span></div>
                    </div>
                </div>

                <div class="card" id="where-card">
                    <div class="card-header">
                        <h3>Where</h3>
                        <button class="add-btn" data-section="where">+</button>
                    </div>
                    <div class="tag-container" id="where-container">
                        <div class="tag">Living room <span class="remove-tag">×</span></div>
                        <div class="tag">Bedroom <span class="remove-tag">×</span></div>
                    </div>
                </div>


                <div class="card" id="when-card">
                    <div class="card-header">
                        <h3>When</h3>
                        <button class="add-btn" data-section="when">+</button>
                    </div>
                    <div class="tag-container" id="when-container">
                        <div class="tag">Living room <span class="remove-tag">×</span></div>
                        <div class="tag">Bedroom <span class="remove-tag">×</span></div>
                    </div>
                </div>
            </div>

            <div class="continue-section">
                <button id="continue-btn">Continue →</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
