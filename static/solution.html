<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解决方案</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar-container">
            <div class="sidebar">
                <div class="sidebar-item"><img src="/static/IconResource/explore-icon-active.png" class="sidebar-icon" alt="Explore"></div></div>
                <div class="sidebar-item">〇</div>
                <div class="sidebar-item">Develop</div>
                <div class="sidebar-item">〇</div>
                <div class="sidebar-item active">Compare</div>
            </div>
        </div>
        <div class="main-content">
            <!-- 方案描述区域 -->
            <div class="solution-section">
                <h2 class="section-title">方案描述</h2>
                <div class="solution-description" id="solution-description">
                    <!-- 将由JavaScript动态填充 -->
                </div>
            </div>

            <!-- 迭代差异评估区域 -->
            <div class="assessment-section">
                <h2 class="section-title">迭代差异评估</h2>
                <div class="assessment-container">
                    <div class="assessment-metrics" id="assessment-metrics">
                        <!-- 新增容器组件 -->
                        <div class="persona-section">
                            <div class="persona-section-title">Persona</div>
                            <div class="s-container">
                                <div class="solution-tag">
                                    <span class="tag-badge">●</span>
                                    <span class="stag-content">发展幅度小，建议重点发散</span>
                                </div>
                                <div class="solution-tag">
                                    <span class="tag-badge">●</span>
                                    <span class="stag-content">发展幅度小，建议重点发散</span>
                                </div>
                            </div>
                        </div>

                        <div class="location-section">
                            <div class="location-section-title">Location</div>
                            <div class="s-container">
                                <div class="solution-tag">
                                    <span class="tag-badge">●</span>
                                    <span class="stag-content">还处于发展阶段，建议继续发展</span>
                                </div>
                            </div>
                        </div>

                        <div class="requirements-section">
                            <div class="requirements-section-title">Requirements</div>
                            <div class="s-container">
                                <div class="solution-tag">
                                    <span class="tag-badge">●</span>
                                    <span class="stag-content">保持迭代，建议观察是否收敛</span>
                                </div>
                                <div class="solution-tag">
                                    <span class="tag-badge">●</span>
                                    <span class="stag-content">已充分响应，建议进入S微调阶段</span>
                                </div>
                            </div>
                        </div>
                        <!-- 指标评估将由JavaScript动态填充 -->
                    </div>
                    <div id="iteration-chart"></div>
                    <div class="assessment-solution" id="assessment-solution">
                        <!-- 指标评估将由JavaScript动态填充 -->
                    </div>
                </div>
            </div>

            <div class="continue-section">
                <!-- <button id="back-btn">← Back</button> -->
                <button id="solutionnext-btn">Next →</button>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
