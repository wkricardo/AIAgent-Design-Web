<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Comparison</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-item active">Explore</div>
            <div class="sidebar-item">Develop</div>
            <div class="sidebar-item">Compare</div>
        </div>
        <div class="main-content">
            <div class="comparison-header">
                <h2>Which features from these products would you like to benchmark?</h2>
            </div>
            <div class="products-grid">
                <!-- Product cards will be dynamically inserted here -->
            </div>
            <div id="floating-container" class="floating-container">
            <div class="floating-header">
                <span class="floating-title">卧室+客厅清扫</span>
                <span class="tag-badge p-type">P</span>
                <button class="close-btn">×</button>
            </div>
            <div class="floating-content">
                <ul class="feature-list">
                <li>强吸力：应对地毯、毛发、颗粒物</li>
                <li>高精地图：精准识别卧室与客厅区域</li>
                <li>分区清扫：可分别设定清洁模式与频率</li>
                <li>湿区不滴漏：通过vibraRise悬浮技术</li>
                <li>智能调节：区域识别+功能自适应</li>
                </ul>
                <div class="feature-tag s-type">强吸力+高精地图</div>
            </div>
            </div>
            <div class="continue-section">
                <button id="next-btn">Next →</button>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
