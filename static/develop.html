<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Develop Product Features</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar-container">
            <div class="sidebar">
                <div class="sidebar-item"><img src="/static/IconResource/explore-icon.png" class="sidebar-icon" alt="Explore"></div>
                <div class="sidebar-item">〇</div>
                <div class="sidebar-item active"><img src="/static/IconResource/develop-icon-active.png" class="sidebar-icon" alt="Develop"></div>
                <div class="sidebar-item">〇</div>
                <div class="sidebar-item"><img src="/static/IconResource/compare-icon.png" class="sidebar-icon" alt="Compare"></div>
            </div>
        </div>
        <div class="main-content">
            <div class="comparison-header">
                <h2>Choose to address the problem/solutions from the concept blocks</h2>
                <p>Please suggest possible solutions based on the current needs</p>
            </div>
            
            <div class="content-grid">
                <!-- Persona Section -->
                <div class="card">
                    <div class="card-header" data-section="persona">
                        Persona
                        <button class="add-btn">+</button>
                    </div>
                    <div class="develop-tag-container">
                        <!-- Persona content here -->
                    </div>
                </div>
                
                <!-- Pain Points/Needs Section -->
                <div class="card">
                    <div class="card-header" data-section="requirement">
                        Pain Points / Needs
                        <button class="add-btn">+</button>
                    </div>
                    <div class="develop-tag-container">
                        <!-- Pain Points content here -->
                    </div>
                </div>
                
                <!-- Usage Location Section -->
                <div class="card">
                    <div class="card-header" data-section="location">
                        Usage Location
                        <button class="add-btn">+</button>
                    </div>
                    <div class="develop-tag-container">
                        <!-- Location content here -->
                    </div>
                </div>
            </div>
            <div class="continue-section">
                <button id="back-btn">← Back</button>
                <button id="generate-btn">Generate Solutions →</button>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
